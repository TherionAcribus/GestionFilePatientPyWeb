name: release

# Pousser un tag « v* » (ex: v1.0.0) déclenche la compilation Linux des deux
# formats (dossier + binaire unique) puis la publication d'une release GitHub
# avec les artefacts en pièces jointes.
#
# Le build tourne sur ubuntu-22.04 (glibc 2.35) : le binaire fonctionne sur
# Ubuntu 22.04+ et Debian 12+. Un binaire x86_64 ne fonctionne PAS sur
# Raspberry Pi (ARM) — la borne s'y installe via install.sh.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: build + release Ubuntu (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Installer les dépendances de build
        run: pip install -r requirements-build.txt

      # Binaire unique autonome -> dist/PharmaFileBorne, déplacé aussitôt :
      # le build dossier écrit ensuite dans dist/PharmaFileBorne/ (même nom).
      - name: Compiler le binaire autonome (onefile)
        run: |
          pyinstaller --noconfirm --clean PharmaFileBorne_onefile.spec
          mkdir -p release-assets
          mv dist/PharmaFileBorne "release-assets/PharmaFileBorne-${{ github.ref_name }}-linux-x86_64"

      - name: Compiler le dossier (onedir) + archive
        run: |
          pyinstaller --noconfirm --clean PharmaFileBorne.spec
          tar -czf "release-assets/PharmaFileBorne-${{ github.ref_name }}-linux-x86_64.tar.gz" \
            -C dist PharmaFileBorne

      # Test de fumée : le binaire onefile doit démarrer (les dépendances Qt /
      # USB système sont installées comme sur une borne réelle). Le critère est
      # le code de sortie : sans serveur ni imprimante, la borne affiche son
      # écran d'attente et boucle — elle est donc tuée par le timeout (124) et
      # journalise des exceptions NORMALES (reconnexions). En revanche un
      # module absent du bundle fait échouer le démarrage (sortie immédiate).
      - name: Test de fumée (le binaire démarre)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0 libasound2 libusb-1.0-0
          BIN="release-assets/PharmaFileBorne-${{ github.ref_name }}-linux-x86_64"
          chmod +x "$BIN"
          set +e
          QT_QPA_PLATFORM=offscreen QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox --disable-gpu" \
            timeout 30 "$BIN" > smoke.log 2>&1
          code=$?
          set -e
          cat smoke.log
          # 0 = sortie propre, 124 = tournait encore au timeout : OK.
          # Tout autre code = plantage au démarrage (module absent, lib Qt…).
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "::error::le binaire a planté au démarrage (exit $code)"
            exit 1
          fi
          if grep -nE "No module named|cannot open shared object" smoke.log; then
            echo "::error::dépendance absente du bundle"
            exit 1
          fi

      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --title "$tag" --generate-notes
          fi
