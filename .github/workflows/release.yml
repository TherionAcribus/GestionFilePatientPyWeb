name: release

# Pousser un tag « v* » (ex: v1.0.0) déclenche la compilation Linux des deux
# formats (dossier + binaire unique) puis la publication d'une release GitHub
# avec les artefacts en pièces jointes.
#
# Le build tourne sur ubuntu-22.04 (glibc 2.35) : le binaire fonctionne sur
# Ubuntu 22.04+ et Debian 12+. Un binaire x86_64 ne fonctionne PAS sur
# Raspberry Pi (ARM) — la borne s'y installe via install.sh.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: build + release Ubuntu (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Installer les dépendances de build
        run: pip install -r requirements-build.txt

      # Binaire unique autonome -> dist/FlowelisBorne, déplacé aussitôt :
      # le build dossier écrit ensuite dans dist/FlowelisBorne/ (même nom).
      - name: Compiler le binaire autonome (onefile)
        run: |
          pyinstaller --noconfirm --clean FlowelisBorne_onefile.spec
          mkdir -p release-assets
          mv dist/FlowelisBorne "release-assets/FlowelisBorne-${{ github.ref_name }}-linux-x86_64"

      - name: Compiler le dossier (onedir) + archive
        run: |
          pyinstaller --noconfirm --clean FlowelisBorne.spec
          tar -czf "release-assets/FlowelisBorne-${{ github.ref_name }}-linux-x86_64.tar.gz" \
            -C dist FlowelisBorne

      # Test de fumée : `--selfcheck` importe les modules chargés
      # dynamiquement (backend Qt de pywebview, backends keyring, escpos/usb)
      # et vérifie les données embarquées, sans affichage ni matériel. C'est le
      # seul test fiable en headless : lancer l'interface WebEngine exigerait
      # un display et planterait pour des raisons étrangères au bundle.
      # Les paquets apt ci-dessous reflètent ceux d'install.sh (WebEngine a
      # besoin de libnss3 & co. dès l'import, pas seulement à l'affichage).
      - name: Test de fumée (--selfcheck du binaire)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libusb-1.0-0 libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libasound2 libxcb-cursor0
          BIN="release-assets/FlowelisBorne-${{ github.ref_name }}-linux-x86_64"
          chmod +x "$BIN"
          OUT=$("$BIN" --selfcheck 2>&1) || {
            echo "$OUT"
            # Le traceback remonte dans l'annotation (visible sans accès aux
            # logs) : échappement % et CRLF, puis \n -> %0A.
            DETAIL=$(echo "$OUT" | tail -12 \
              | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::selfcheck a échoué :%0A$DETAIL"
            exit 1
          }
          echo "$OUT"

      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --title "$tag" --generate-notes
          fi
